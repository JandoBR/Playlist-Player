<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <div id="app">

    <div class="titlebar">
      <div id="titlebar-left" class="titlebar-left">
      </div>

      <div id="titlebar-right" class="titlebar-right">
      </div>

    </div>


    <div id="statusText">Loading status...</div>

    <div class="image-container">
      <img id="thumbnail" src="" alt="Thumbnail" draggable="false" />
      <div class="slider-wrapper">
        <input type="range" id="seekSlider" min="0" max="300" value="0">
      </div>
    </div>

    <div id="controls">
      <div class="button-container">
        <button id="prevBtn">⏮️</button>
        <button id="playBtn">▶️</button>
        <button id="nextBtn">⏭️</button>
      </div>
    </div>


    <script src="main.js"></script>
</body>

</html>
